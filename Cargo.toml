[package]
name = "aegis_vm"
version = "0.2.53"
edition = "2021"
description = "Advanced Rust code virtualization and obfuscation framework"
license = "MIT"
repository = "https://github.com/lzmuhioin/rs-vm"
keywords = ["obfuscation", "virtualization", "security", "vm", "protection"]
categories = ["cryptography", "development-tools"]
readme = "README.md"

[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = [
    "aes",
    "alloc",
] }
hmac = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }
digest = { version = "0.11", default-features = false }
subtle = { version = "2.5", default-features = false }
aegis_vm_macro = { path = "vendor/aegis_vm_macro", version = "0.2.52" } # 见 docs/adr：超级指令需要宏与运行时同轮升级
spin = { version = "0.10", default-features = false, features = ["once"] }

[build-dependencies]
hmac = "0.13"
sha2 = "0.11"

[features]
default = ["std", "handler_mutation", "whitebox"]
std = []
vm_debug = []
handler_mutation = []
# White-box cryptography - REQUIRED for encrypted bytecode
# The proc-macro uses WBC for key derivation, runtime must match.
# This is now default because encrypted execution won't work without it.
whitebox = []
# Lightweight WBC variant (~50KB, T-boxes only) - alternative to full whitebox
whitebox_lite = []
# Experimental: Async VM engine for anti-analysis (state machine obfuscation)
# Adds ~100 lines, no external dependencies. Custom micro-executor.
async_vm = []
# 动态性能剖析：统计每条指令实际执行多少次（默认关闭，零运行时开销）
prof = []

[profile.dev.build-override]
opt-level = 2

[profile.release.build-override]
opt-level = 2

[profile.release]
strip = true
lto = "fat"       # En agresif link-time optimization
codegen-units = 1 # Paralel derlemeyi kapat, boyutu küçült
panic = "abort"   # Panic kodlarını at
opt-level = "z"   # Boyut odaklı optimizasyon ("s" yerine "z" daha agresif)

[[bench]]
name = "vm_workloads"
harness = false

[[bench]]
name = "real_world"
harness = false

[[bench]]
name = "call_overhead"
harness = false

[profile.bench]
opt-level = 3

[[bench]]
name = "bottleneck"
harness = false

[[bench]]
name = "prof_split"
harness = false
